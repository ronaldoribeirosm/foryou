<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tá pronta?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,wght@1,600&display=swap">
<style>
:root{
  --bg:#1a0610; --bg2:#3a0c20; --rose:#c1123f; --rose2:#e8345d; --cream:#f8e8ea;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg) 72%);color:var(--cream);
  font-family:'Fraunces',Georgia,serif;overflow:hidden}

/* chuva de corações e sushi */
.fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fx span{position:absolute;bottom:-60px;opacity:0;animation:sobe linear infinite;will-change:transform}
@keyframes sobe{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
  10%{opacity:.9}
  50%{transform:translate3d(var(--sw),-60vh,0) rotate(var(--r))}
  90%{opacity:.9}
  100%{transform:translate3d(calc(var(--sw) * -1),-125vh,0) rotate(calc(var(--r) * -1));opacity:0}
}

.ask{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px 20px;text-align:center}
.coracao{font-size:clamp(48px,14vw,72px);animation:bate 1.1s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(232,52,93,.7))}
@keyframes bate{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
.ask h1{font-style:italic;font-weight:600;font-size:clamp(40px,13vw,76px);margin:0;letter-spacing:-.01em;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.sub{font-family:'Caveat',cursive;font-size:clamp(24px,6.5vw,32px);margin:0 0 14px;opacity:.9}
.btns{display:flex;gap:18px;align-items:center;justify-content:center;min-height:64px}
button{font:inherit;font-size:22px;min-height:52px;border:0;border-radius:999px;padding:14px 40px;cursor:pointer;color:#fff;touch-action:manipulation}
#sim{background:var(--rose);box-shadow:0 8px 30px rgba(193,18,63,.5)}
#sim:hover{background:var(--rose2)}
#nao{background:#3a2a31;color:var(--cream);transition:left .25s ease,top .25s ease}
#nao.fugiu{position:fixed;z-index:5}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#aviso{position:fixed;left:50%;bottom:calc(10% + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.9);width:min(88vw,460px);
  text-align:center;background:var(--cream);color:#4a0b1d;font-family:'Caveat',cursive;font-size:clamp(26px,7vw,34px);line-height:1.15;
  padding:16px 22px;border-radius:18px;opacity:0;pointer-events:none;transition:.25s;z-index:4}
#aviso.on{opacity:1;transform:translateX(-50%) scale(1)}

/* tela final: conteúdo em cima, jardim embaixo, sem sobreposição */
#final{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;text-align:center;
  padding-top:env(safe-area-inset-top,0px);background:radial-gradient(circle at 50% 30%,#4a0f27,#12040a 78%)}
#final.show{display:flex;animation:in .6s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
.conteudo{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2dvh;padding:12px 16px 4px}
.foto{flex:none;height:clamp(110px,29dvh,300px);aspect-ratio:4/5;max-width:70vw;object-fit:cover;object-position:50% 25%;
  border-radius:999px 999px 14px 14px;border:3px solid var(--cream);opacity:0;transform:scale(.92)}
.msg{margin:0;font-family:'Caveat',cursive;font-weight:700;font-size:clamp(28px,min(9.5vw,6.6dvh),60px);line-height:1.05;
  max-width:11em;opacity:0;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#final.show .foto{animation:aparece 1.2s 6.2s ease forwards}
#final.show .msg{animation:aparece 1.4s 6.8s ease forwards}
@keyframes aparece{to{opacity:1;transform:none}}

.jardim{flex:none;position:relative;width:100%;height:clamp(190px,38dvh,380px);overflow:hidden;pointer-events:none}
.flor{position:absolute;bottom:0;overflow:visible}
.caule{fill:none;stroke-dasharray:100;stroke-dashoffset:100;animation:desenha 3.2s var(--d) ease-out forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
.cresce{transform:scale(0);transform-origin:0 0;animation:brota 1.1s var(--t) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes brota{to{transform:scale(1)}}

@media (orientation:landscape) and (max-height:540px){
  .conteudo{flex-direction:row;gap:5vw}
  .foto{height:clamp(90px,46dvh,240px)}
  .msg{font-size:clamp(26px,8dvh,48px);text-align:left}
  .jardim{height:30dvh;min-height:110px}
}
@media (prefers-reduced-motion:reduce){
  .fx span,.coracao{animation:none}
  .caule,.cresce,#final.show .foto,#final.show .msg{animation-duration:.01s;animation-delay:0s}
  #nao{transition:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4a0416"/><stop offset="1" stop-color="#8e0e2e"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6d0720"/><stop offset="1" stop-color="#b01138"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8e0e2e"/><stop offset="1" stop-color="#d81b4a"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a3112f"/><stop offset="1" stop-color="#f0587c"/></linearGradient>
</defs></svg>

<div class="fx" id="fx" aria-hidden="true"></div>

<main class="ask" id="ask">

  <h1>Está pronta?</h1>
  <p class="sub">tenho uma surpresa pra você 🍣</p>
  <div class="btns">
    <button id="sim">Sim</button>
    <button id="nao">Não</button>
  </div>
</main>
<div id="aviso" role="status" aria-live="polite">Olha que eu vou falar que meu braço é maior que a sua perna dnv 😤</div>

<script>
(function(){
  /* chuva de corações e sushi */
  var fx=document.getElementById('fx'), em=['💗','❤️','🍣','💖','🍱','🍣','💕','🍙'], q=innerWidth<500?16:26, h='';
  for(var i=0;i<q;i++){
    var d=(9+Math.random()*9).toFixed(1);
    h+='<span style="left:'+(Math.random()*96).toFixed(1)+'%;font-size:'+(18+Math.random()*26).toFixed(0)+'px;animation-duration:'+d+'s;animation-delay:-'+(Math.random()*d).toFixed(1)+'s;--sw:'+((Math.random()*80-40).toFixed(0))+'px;--r:'+((Math.random()*50-25).toFixed(0))+'deg">'+em[i%em.length]+'</span>';
  }
  fx.innerHTML=h;

  /* botão que foge */
  var nao=document.getElementById('nao'), sim=document.getElementById('sim'), aviso=document.getElementById('aviso'), cliques=0, timer;
  function foge(){
    nao.classList.add('fugiu');
    var w=nao.offsetWidth, hh=nao.offsetHeight, m=16, vw=window.innerWidth, vh=window.innerHeight;
    nao.style.left=(m+Math.random()*Math.max(0,vw-w-2*m))+'px';
    nao.style.top=(m+Math.random()*Math.max(0,vh-hh-2*m))+'px';
  }
  function tentou(){
    cliques++; foge();
    if(cliques>3){
      aviso.classList.add('on'); clearTimeout(timer);
      timer=setTimeout(function(){aviso.classList.remove('on')},3200);
    }
  }
  nao.addEventListener('pointerdown',function(e){e.preventDefault();tentou();});
  nao.addEventListener('click',function(e){ if(e.detail===0) tentou(); });

  /* rosa em traço, no estilo do desenho: o caule sobe, as folhas brotam e a flor abre aos poucos */
  var ST='stroke="#3a0212" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"';
  var BLADE='M-303 -275C-220 -290 -100 -240 -76 -175C-72 -145 -108 -135 -148 -142C-238 -160 -318 -200 -303 -275Z';
  var PET='M0 0C-30 -60 -80 -115 -130 -148';
  var STEM='M485 1245C488 1180 495 1100 490 1000C482 850 470 700 485 545';
  function p(d,fill){ return '<path d="'+d+'" fill="'+fill+'" '+ST+'/>'; }
  function linha(d){ return '<path d="'+d+'" fill="none" '+ST+'/>'; }
  function grupo(t,corpo){
    return '<g transform="translate(480 230)"><g class="cresce" style="--t:'+t.toFixed(2)+'s"><g transform="translate(-480 -230)">'+corpo+'</g></g></g>';
  }
  function folha(tf,t){
    return '<g transform="'+tf+'"><g class="cresce" style="--t:'+t.toFixed(2)+'s">'+
      '<path d="'+PET+'" fill="none" stroke="#1f4d2a" stroke-width="22" stroke-linecap="round"/>'+
